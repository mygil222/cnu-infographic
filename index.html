<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>학사 INFO</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<style>
  :root { --bg:#0f0f0f; --card:#1a1a1a; --line:#333; --text:#e8e8e8; --mute:#999; --dim:#888;
          --blue:#3b82f6; --teal:#2dd4bf; --grey:#4a4a4a; --green:#6ee7a8; --panel:#141414; }
  * { box-sizing:border-box; }
  body { background:var(--bg); margin:0; padding:40px 16px; display:flex; flex-direction:column;
         align-items:center; gap:24px; color:var(--text);
         font-family:'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif; }
  .wrap { width:100%; max-width:1840px; display:grid; align-items:start; gap:24px;
          grid-template-columns:repeat(auto-fit, minmax(min(560px, 100%), 1fr)); }
  .cell { container-type:inline-size; container-name:cell; width:100%; max-width:920px; justify-self:center; }
  .card { width:100%; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:44px; }
  .head { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:6px 16px; }
  .head h2 { margin:0; font-size:30px; }
  .head h2 span { color:var(--dim); font-size:24px; margin-right:12px; font-weight:400; }
  .head .basis { color:var(--mute); font-size:20px; }
  .kpis { display:flex; gap:20px 56px; margin:32px 0 30px; flex-wrap:wrap; }
  .kpi { padding:8px 12px; margin:-8px -12px; border-radius:12px; }
  .kpi .label { color:var(--mute); font-size:22px; }
  .kpi .num { font-family:Georgia,serif; font-size:52px; line-height:1.15; }
  .kpi .num small { font-size:26px; color:var(--mute); }
  .kpi .num .unit { font-size:30px; }
  .kpi .rate { color:var(--green); font-size:20px; margin-top:2px; }
  .click { cursor:pointer; transition:background .15s; }
  .click:hover { background:#222; }
  .click:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .click.active, .click.sel { background:#1f2a3d; }
  .caret { color:var(--blue); font-size:16px; margin-left:8px; display:inline-block; transition:transform .15s; }
  .active .caret, .sel .caret { transform:rotate(90deg); }
  .hint { color:#6b8fd6; font-size:17px; margin:0 0 12px; }
  .sub { color:var(--mute); font-size:22px; margin-bottom:6px; }
  table.main { width:100%; border-collapse:collapse; font-size:22px; }
  table.main th { color:var(--mute); font-weight:400; text-align:right; padding:14px 8px; border-bottom:1px solid #444; }
  table.main td { text-align:right; padding:20px 8px; border-bottom:1px solid var(--line); }
  table.main th:first-child, table.main td:first-child { text-align:left; }
  table.main td:first-child { font-weight:700; }
  table.main tr.click:hover td, table.main tr.click.active td { background:inherit; }
  table.main tr.click:hover { background:#222; } table.main tr.click.active { background:#1f2a3d; }
  table.main tr.off { opacity:.7; }
  .subnote { font-size:16px; color:#777; margin-left:8px; }
  table.top td.rk { width:64px; color:#6b8fd6; font-weight:700; text-align:center; }
  table.top th:first-child { text-align:center; }
  table.top td.cn { text-align:left; }
  table.top td.cn small { display:block; color:#888; font-weight:400; font-size:15px; margin-top:2px; }
  table.top th:nth-child(2) { text-align:left; }
  table.top td { font-size:20px; padding:14px 8px; }
  .legend { color:#bbb; font-size:22px; margin-bottom:6px; }
  .legend i { display:inline-block; width:16px; height:16px; margin:0 6px 0 0; vertical-align:-1px; border-radius:2px; }
  .legend i.g { background:var(--grey); } .legend i.b { background:var(--blue); margin-left:10px; }
  .bars .row { display:grid; grid-template-columns:290px 1fr 170px; align-items:center; min-height:66px;
               font-size:22px; padding:4px 8px; border-radius:10px; --gapbg:var(--card); }
  .bars .row.click:hover { --gapbg:#222; } .bars .row.active { --gapbg:#1f2a3d; }
  .bars .val .done { color:#6aa5ff; font-size:30px; font-weight:800; }
  .bars .val .of { color:var(--mute); font-size:19px; font-weight:400; }
  .bars .val small { display:block; color:#7e8794; font-size:14px; font-weight:400; margin-top:-2px; }
  .brk-track { display:flex; align-items:center; }
  .seg { position:relative; height:24px; } .seg.s1 { flex:0 0 48%; } .seg.s2 { flex:1 1 auto; }
  .brk { flex:0 0 14px; height:34px; background:var(--gapbg); transform:skewX(-24deg);
         border-left:2px solid #b5bcc9; border-right:2px solid #b5bcc9; margin:0 3px; }
  .brknote { margin-left:18px; font-size:16px; color:#8b93a1; }
  .brknote .zz { display:inline-block; width:8px; height:15px; margin:0 6px 0 0; vertical-align:-3px;
                 transform:skewX(-24deg); border-left:2px solid #b5bcc9; border-right:2px solid #b5bcc9; background:none; border-radius:0; }
  .bars .name { font-weight:700; }
  .track { position:relative; height:24px; }
  .grey, .blue { position:absolute; left:0; top:0; height:24px; border-radius:3px; }
  .grey { background:var(--grey); } .blue { background:var(--blue); border-radius:3px 0 0 3px; min-width:4px; }
  .bars .val { text-align:right; font-weight:700; }
  .note { color:var(--dim); font-size:17px; line-height:1.7; margin-top:22px; }
  .note p { margin:0 0 4px; }

  .detail { margin-top:18px; background:var(--panel); border:1px solid #2a3550; border-radius:16px;
            padding:24px 26px; display:none; }
  .detail.open { display:block; animation:fade .2s; }
  @keyframes fade { from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none} }
  .detail h3 { margin:0 0 4px; font-size:22px; }
  .detail .lead { color:var(--mute); font-size:18px; margin:0 0 16px; line-height:1.6; }
  .detail .close { float:right; background:none; border:1px solid #444; color:var(--mute);
                   border-radius:8px; padding:4px 12px; font-size:16px; cursor:pointer; }
  .detail .close:hover { color:#fff; border-color:#888; }
  .sec { margin-top:22px; }
  .sec h4 { margin:0 0 8px; font-size:19px; color:#cfd6e4; font-weight:700; }
  .sec h4 .lg { font-weight:400; font-size:16px; color:var(--mute); margin-left:10px; }
  .sec h4 .lg i { display:inline-block; width:11px; height:11px; border-radius:2px; margin:0 4px 0 8px; vertical-align:0; }
  .srow { display:grid; grid-template-columns:minmax(120px,230px) 1fr 150px; align-items:center;
          gap:10px; padding:5px 0; font-size:18px; }
  .srow .lb { overflow:hidden; text-overflow:ellipsis; }
  .srow .lb small { color:var(--dim); display:block; font-size:14px; }
  .stack { display:flex; height:16px; background:#222; border-radius:3px; overflow:hidden; }
  .stack span { display:block; height:100%; }
  .srow .v { text-align:right; font-size:17px; } .srow .v b { font-size:19px; }
  .srow .v small { color:var(--dim); display:block; font-size:14px; }
  .sec:not(.all) .extra { display:none; }
  .sec.one .srow { grid-template-columns:minmax(120px,240px) 1fr 70px; }
  .srow.tog { cursor:pointer; border-radius:8px; }
  .srow.tog:hover { background:#1b2130; }
  .srow.tog:focus-visible { outline:2px solid var(--blue); }
  .srow .lb .caret { margin-left:6px; }
  .srow.tog.open .caret { transform:rotate(90deg); }
  .kids { display:none; margin:2px 0 10px 12px; padding:4px 0 4px 12px; border-left:2px solid #2a3550; }
  .kids.show { display:block; }
  .srow.kid { font-size:16px; padding:3px 0; color:#cfd6e4; }
  .srow.kid .stack { height:11px; }
  .more { margin-top:8px; background:none; border:1px solid #3a4560; color:#8fb0f0; border-radius:8px;
          padding:6px 14px; font-size:16px; cursor:pointer; }
  .more:hover { background:#1f2a3d; }
  .scroll { max-height:420px; overflow:auto; border:1px solid var(--line); border-radius:10px; }
  table.sm { width:100%; border-collapse:collapse; font-size:17px; }
  table.sm th { position:sticky; top:0; background:#202020; color:var(--mute); font-weight:400; text-align:right;
                padding:10px 10px; border-bottom:1px solid #444; }
  table.sm td { padding:9px 10px; border-bottom:1px solid #262626; text-align:right; }
  table.sm th:first-child, table.sm td:first-child { text-align:left; }
  table.sm td:first-child { width:52%; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; background:var(--green); }
  .dot.no { background:transparent; border:1px solid #777; }
  .zero { color:#666; }
  .footer { color:#666; font-size:14px; text-align:center; max-width:920px; }

  @media (max-width:720px) { body { padding:20px 10px; } }

  /* 카드 폭 800px 이하 (좌우 배치 시 노트북 화면 등) */
  @container cell (max-width:800px) {
    .card { padding:32px 28px; border-radius:20px; }
    .head h2 { font-size:26px; } .head h2 span { font-size:20px; } .head .basis { font-size:17px; }
    .kpis { gap:16px 36px; margin:24px 0 22px; }
    .kpi .label { font-size:18px; } .kpi .num { font-size:42px; } .kpi .num .unit { font-size:24px; }
    .kpi .num small { font-size:21px; } .kpi .rate { font-size:17px; }
    .sub, .legend { font-size:19px; } .hint { font-size:15px; }
    table.main { font-size:19px; } table.main th { font-size:16px; padding:12px 6px; } table.main td { padding:16px 6px; }
    .bars .row { grid-template-columns:208px 1fr 132px; font-size:17px; min-height:60px; } .bars .name { white-space:nowrap; }
    .bars .val .done { font-size:26px; } .bars .val .of { font-size:16px; } .brknote { display:block; margin:4px 0 0; font-size:14px; }
    .note { font-size:14px; } .detail { padding:20px; }
    .detail h3 { font-size:20px; } .detail .lead { font-size:16px; }
    .srow { grid-template-columns:minmax(100px,164px) 1fr 152px; font-size:16px; } .srow .v b { font-size:17px; } .srow .v small { white-space:nowrap; font-size:13px; }
    table.sm { font-size:15px; }
    table.top td { font-size:17px; padding:11px 6px; } table.top td.rk { width:44px; }
    .sec.one .srow { grid-template-columns:minmax(110px,200px) 1fr 64px; }
  }
  /* 카드 폭 620px 이하 (휴대폰 등) */
  @container cell (max-width:560px) {
    .card { padding:24px 18px; border-radius:18px; }
    .head h2 { font-size:24px; } .head .basis { font-size:15px; }
    .kpi .label { font-size:16px; } .kpi .num { font-size:38px; } .kpi .num .unit { font-size:22px; } .kpi .num small { font-size:18px; }
    .kpis { gap:14px 28px; } .sub, .legend { font-size:17px; }
    table.main { font-size:16px; } table.main th { padding:10px 4px; font-size:14px; } table.main td { padding:14px 4px; }
    .bars .row { grid-template-columns:1fr; min-height:0; padding:8px; gap:4px; font-size:17px; }
    .bars .val { text-align:left; }
    .note { font-size:14px; } .detail { padding:16px 14px; }
    .srow { grid-template-columns:1fr; gap:3px; } .srow .v { text-align:left; }
    table.top td { font-size:16px; padding:10px 4px; } table.top td.rk { width:36px; } table.top td.cn small { font-size:13px; }
    table.sm { font-size:14px; } table.sm th, table.sm td { padding:8px 6px; }
    table.sm th:not(:first-child), table.sm td:not(:first-child) { white-space:nowrap; }
    table.sm td:first-child { width:auto; }
    .sec h4 .lg { display:block; margin:4px 0 0; }
    .sec.one .srow { grid-template-columns:1fr; }
  }

  /* ===== 한 페이지 대시보드 공통 ===== */
  .top { width:100%; max-width:1840px; }
  .top h1 { margin:0 0 8px; font-size:32px; }
  .top p { margin:0; color:var(--mute); font-size:18px; line-height:1.6; }
  .top p b { color:#fff; }
  .draftbar { margin-top:12px; display:inline-block; background:#2a2412; border:1px solid #5a4a1a; color:#e8c766;
              border-radius:8px; padding:7px 14px; font-size:15px; line-height:1.5; }
  .strip { width:100%; max-width:1840px; display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr));
           border:1px solid var(--line); border-radius:14px; background:var(--card); overflow:hidden; }
  .strip .tile { padding:16px 22px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); margin:0 -1px -1px 0; }
  .strip .tile .l { color:var(--mute); font-size:14px; }
  .strip .tile .n { font-family:Georgia,serif; font-size:30px; margin-top:2px; }
  .strip .tile .n small { font-family:inherit; font-size:15px; color:var(--mute); margin-left:4px; }
  em.sample { font-style:normal; font-size:13px; color:#e8c766; border:1px solid #5a4a1a; border-radius:6px;
              padding:1px 7px; margin-left:10px; vertical-align:middle; font-weight:400; }
  .hb { display:grid; grid-template-columns:170px 1fr 110px; align-items:center; gap:12px; padding:6px 0; font-size:18px; }
  .hb .lb { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hb .bar { position:relative; height:16px; background:#262626; border-radius:3px; }
  .hb .bar i { position:absolute; left:0; top:0; height:100%; display:block; border-radius:3px; }
  .hb .stk { display:flex; height:18px; border-radius:3px; overflow:hidden; }
  .hb .stk span { display:block; height:100%; }
  .hb .v { text-align:right; font-weight:700; }
  .hb .avg { position:absolute; top:-5px; bottom:-5px; border-left:2px dashed #aab2c0; }
  .hb.hot .bar i { background:#ef4444; } .hb .bar i { background:#6b6b6b; }
  .lg2 { display:flex; gap:16px; flex-wrap:wrap; color:#bbb; font-size:16px; margin:2px 0 10px; }
  .lg2 i { display:inline-block; width:12px; height:12px; border-radius:2px; margin-right:6px; vertical-align:-1px; }
  .delta { font-size:18px; margin-top:2px; } .delta.down { color:var(--green); } .delta.up { color:#f87171; }
  .rate1 { font-family:Georgia,serif; font-size:50px; line-height:1.1; }
  .sub2 { color:var(--mute); font-size:18px; margin:6px 0 10px; }
  svg.line { width:100%; height:auto; display:block; margin:6px 0 18px; }
  svg.line text { fill:#8b93a1; font-size:13px; font-family:inherit; }
  .kpi.static { cursor:default; }
  @container cell (max-width:800px) {
    .hb { grid-template-columns:128px 1fr 70px; font-size:16px; }
    .rate1 { font-size:40px; } .sub2 { font-size:16px; } .delta { font-size:16px; }
  }
  @container cell (max-width:560px) {
    .hb { grid-template-columns:1fr; gap:4px; padding:8px 0; } .hb .v { text-align:left; }
  }
  @media (max-width:720px) { .top h1 { font-size:24px; } .top p { font-size:15px; } .strip .tile { padding:12px 14px; } .strip .tile .n { font-size:24px; } }
.hb[hidden] { display:none; }
</style>
</head>
<body>

<div class="top">
  <h1>충남대학교 학사 현황</h1>
  <p id="headline"></p>
</div>
<div class="strip" id="strip"></div>
<div class="wrap">
  <div class="cell"><div class="card" id="c1"></div></div>
  <div class="cell"><div class="card" id="c2"></div></div>
  <div class="cell"><div class="card" id="c3"></div></div>
  <div class="cell"><div class="card" id="c4"></div></div>
  <div class="cell"><div class="card" id="c5"></div></div>
</div>
<div class="footer">집계 자료만 표시합니다 (학번·성명 등 개인정보 미포함)</div>

<script>
/* ============================================================
   ★ 숫자 수정 안내
   - D3 : 03 다전공 현황 (근거표 '이수자명부' 집계값)
   - D4 : 04 마이크로디그리 현황 (04-5 분류파일 + 04-2 성과분석보고서 집계값)
   - CONFIG : 보고서·엑셀에서 직접 계산되지 않는 값 (참여 학생 등)
   ============================================================ */
const CONFIG = {
  d3: { title:"다전공 현황", basis:"2026학년도 1학기 이수 (8.19. 기준)" },
  d4: { title:"마이크로디그리 현황", basis:"2026학년도 1학기 기준",
        participants:9883,    // 참여 학생(고유 학번) — 2026-1 기준학점목록(소단위 전공과정 중 마이크로디그리과정만, 트랙과정 제외)
        completers:351,       // 2026-1 이수 학생 수
        cases:432,            // 2026-1 이수 건수

const fmt = n => Number(n).toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COL = { a:"#3b82f6", b:"#2dd4bf", c:"#a78bfa" };

/* ---------- 공통: 막대 섹션 ---------- */
// items: [{label, sub?, vals:[...], note?}] / series: [{name,color}]
function rowHtml(it, max, series, cls, tog) {
  const tot = it.vals.reduce((a,b)=>a+b,0);
  const parts = it.vals.map((v,k)=>`<span style="width:${v/max*100}%;background:${series[k].color}"></span>`).join("");
  const detail = series.length > 1
    ? `<small>${series.map((s,k)=>`${s.name} ${it.vals[k]}`).join(" · ")}</small>` : (it.note?`<small>${esc(it.note)}</small>`:"");
  return `<div class="srow ${cls||""}${tog?" tog":""}" ${tog?'data-tog tabindex="0" role="button"':""}>
    <div class="lb">${esc(it.label)}${tog?'<span class="caret">▸</span>':""}${it.sub?`<small>${esc(it.sub)}</small>`:""}</div>
    <div class="stack">${parts}</div>
    <div class="v"><b>${fmt(tot)}</b>${detail}</div></div>`;
}
// items: [{label, sub?, vals:[...], note?, kids?:[{label, vals}]}] / series: [{name,color}]
function section(title, items, series, limit, extraNote, hint) {
  const sum = a => a.reduce((x,y)=>x+y,0);
  const max = Math.max(1, ...items.map(it => sum(it.vals)));
  const lg = series.length > 1
    ? `<span class="lg">${series.map(s=>`<i style="background:${s.color}"></i>${s.name}`).join("")}</span>` : "";
  const rows = items.map((it,i) => {
    const ex = limit && i>=limit ? "extra" : "";
    if (!it.kids) return `<div class="item ${ex}">${rowHtml(it,max,series)}</div>`;
    return `<div class="item ${ex}">${rowHtml(it,max,series,"",true)}
      <div class="kids">${it.kids.map(k=>rowHtml(k,sum(it.vals)||1,series,"kid")).join("")}</div></div>`;
  }).join("");
  const more = limit && items.length > limit
    ? `<button class="more" type="button" data-more>전체 보기 (${items.length}개)</button>` : "";
  return `<div class="sec${series.length===1?" one":""}"><h4>${esc(title)}${lg}</h4>${hint?`<p class="hint" style="margin:0 0 6px">${hint}</p>`:""}${rows}${more}${extraNote?`<div class="lead" style="margin-top:8px">${extraNote}</div>`:""}</div>`;
}
const SER2 = [{name:"복수전공",color:COL.a},{name:"부전공",color:COL.b}];

/* ---------- 열기/닫기 공통 처리 ---------- */
function wire(card, panel, render) {
  let openKey = null;
  const close = () => { panel.classList.remove("open"); card.querySelectorAll(".click.active").forEach(e=>e.classList.remove("active")); openKey=null; };
  card.addEventListener("click", ev => {
    if (ev.target.closest("[data-more]")) {
      const sec = ev.target.closest(".sec"); const on = sec.classList.toggle("all");
      const btn = ev.target.closest("[data-more]"); btn.textContent = on ? "접기" : btn.dataset.label;
      return;
    }
    if (ev.target.closest("[data-close]")) { close(); return; }
    const tog = ev.target.closest("[data-tog]");
    if (tog) { tog.classList.toggle("open"); tog.nextElementSibling.classList.toggle("show"); return; }
    const el = ev.target.closest("[data-key]");
    if (!el || el.dataset.off) return;
    const key = el.dataset.key;
    if (openKey === key) { close(); return; }
    close(); openKey = key; el.classList.add("active");
    panel.innerHTML = `<button class="close" type="button" data-close>닫기 ✕</button>` + render(key);
    panel.querySelectorAll("[data-more]").forEach(b => b.dataset.label = b.textContent);
    panel.classList.add("open");
    panel.scrollIntoView({behavior:"smooth", block:"nearest"});
  });
  card.addEventListener("keydown", ev => {
    if ((ev.key==="Enter"||ev.key===" ") && ev.target.matches("[data-key],[data-tog],[data-view]")) { ev.preventDefault(); ev.target.click(); }
  });
}

      return { lead:`${view} 이수자 ${k.total}명을 이수자가 원래 소속된 단과대학(주전공) 기준으로 나눈 값입니다.`,
               html: section("주전공 단과대학별 "+view+" 이수자", items,
                 [{name:view,color:view==="복수전공"?COL.a:COL.b}], 3, "", HINT) };
    }
    if (view === "융합계") {
      const m = {}, dm = {};
      Object.values(bt).forEach(t=>{
        t.colleges.forEach(c=>{ m[c[0]]=m[c[0]]||[0,0]; m[c[0]][0]+=c[1]; m[c[0]][1]+=c[2]; });
        t.depts.forEach(d=>{ const key=d[0]+"|"+d[1]; dm[key]=dm[key]||[d[0],d[1],0,0]; dm[key][2]+=d[2]; dm[key][3]+=d[3]; });
      });
      const items = Object.entries(m).map(([k,v])=>({label:k, vals:v,
        kids:Object.values(dm).filter(d=>d[0]===k).map(d=>({label:d[1],vals:[d[2],d[3]]})).sort(byDesc)})).sort(byDesc);
      return { lead:`연계·자기설계·융합·DSC공유대학 이수 ${fusionTotal}명 (복수·부전공 이수자와 중복 포함)을 주전공 단과대학별로 나눈 값입니다.`,
               html: section("주전공 단과대학별 융합전공 이수자", items, SER2, 3, "", HINT) };
    }
    // 기본: 복수전공 vs 부전공 비교
    const dep = {};
    ["복수전공","부전공"].forEach((kind,idx)=>D3.kpi[kind].depts.forEach(d=>{
      const key=d[0]+"|"+d[1]; dep[key]=dep[key]||[d[0],d[1],0,0]; dep[key][2+idx]+=d[2]; }));
    const items = D3.allColleges.map(c=>({label:c[0], vals:[c[1],c[2]],
      kids:Object.values(dep).filter(d=>d[0]===c[0]).map(d=>({label:d[1],vals:[d[2],d[3]]})).sort(byDesc)})).sort(byDesc);
    const cnt = items.reduce((a,it)=>a+it.vals[0]+it.vals[1],0);
    return { lead:`복수전공 ${D3.kpi["복수전공"].total} + 부전공 ${D3.kpi["부전공"].total} = 계 ${cnt}건을 주전공 단과대학별로 비교한 값입니다.`,
             html: section("주전공 단과대학별 이수자 · 복수전공 vs 부전공", items, SER2, 3, "", HINT) };
  }
  let cur = "both";
  const box = card.querySelector("#chart3"), vh = card.querySelector("#viewhint");
  function draw() {
    const c = chartFor(cur);
    box.innerHTML = `<p class="lead" style="margin:0 0 8px">${c.lead}</p>` + c.html;
    box.querySelectorAll("[data-more]").forEach(b => b.dataset.label = b.textContent);
    card.querySelectorAll(".kpi").forEach(e => e.classList.toggle("sel", e.dataset.view === cur));
    vh.textContent = cur === "both"
      ? "▸ 위 숫자를 누르면 해당 항목만 볼 수 있습니다 (복수전공 / 부전공 / 융합전공 계)"
      : "▸ 선택한 항목만 표시 중 · 같은 숫자를 다시 누르면 복수·부전공 비교로 돌아갑니다";
  }

  function render(key) {

    return `<h3>${name} 상세</h3>

      + section("주전공 대학별 분포", d.colleges.map(c=>({label:c[0],vals:[c[1],c[2]]})), SER2, 8)
      + section("주전공 학과별 분포", d.depts.map(x=>({label:x[1],sub:x[0],vals:[x[2],x[3]]})), SER2, 10);
  }
  wire(card, card.querySelector("#d3"), render);
})();

function lineChart(pts, ymin, ymax, ticks, sel) {
  const W=560,H=215,L=44,R=50,T=14,B=30, pw=W-L-R, ph=H-T-B;
  const X=i=>L+pw*i/(pts.length-1), Y=v=>T+ph*(1-(v-ymin)/(ymax-ymin));
  const grid = ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2c2c2c"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`).join("");
  const xs = pts.map((p,i)=>`<text data-y="${i}" x="${X(i)}" y="${H-8}" text-anchor="middle" style="cursor:pointer;${i===sel?'fill:#fff;font-weight:700':''}">${p[0]}</text>`).join("");
  const path = pts.map((p,i)=>`${i?"L":"M"}${X(i)},${Y(p[1])}`).join(" ");
  const dots = pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p[1])}" r="${i===sel?6:3.5}" fill="${i===sel?'#60a5fa':'#3b82f6'}" ${i===sel?'stroke="#fff" stroke-width="2"':''}/><text x="${X(i)}" y="${Y(p[1])-12}" text-anchor="middle" style="fill:${i===sel?'#fff':'#cfd5df'};${i===sel?'font-weight:700':''}">${p[1].toFixed(2)}</text><circle data-y="${i}" cx="${X(i)}" cy="${Y(p[1])}" r="16" fill="transparent" style="cursor:pointer"/>`).join("");
  return `<svg class="line" viewBox="0 0 ${W} ${H}" role="img" aria-label="중도탈락률 추이">${grid}${xs}<path d="${path}" fill="none" stroke="#3b82f6" stroke-width="2"/>${dots}</svg>`;
}
